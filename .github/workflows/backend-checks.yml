name: Backend Checks

on:
  pull_request:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        go-version: ['1.25']
        mongodb-version: ['8.0']
        dir:
          - backend/lib/authors
          - backend/lib/books
          - backend/lib/db
          - backend/lib/ingest
          - backend/lib/isbndb
          - backend/lib/libraries
          - backend/lib/otps
          - backend/packages/auth/sendOtp
          - backend/packages/auth/verifyOtp
          - backend/packages/books/getBookByIsbn
          - backend/packages/books/getBooksByAuthor
          - backend/packages/books/ingestCatalog
          - backend/packages/books/searchBooks
          - backend/packages/libraries/createLibrary
          - backend/packages/libraries/getLibraries
          - backend/packages/libraries/updateLibrary
          - backend/packages/libraries/deleteLibrary
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Set up MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-replica-set: rs
          mongodb-port: 27017
      - name: Lint and Test
        working-directory: ${{ matrix.dir }}
        env:
          AUTH_JWT_SECRET: abcdefg123
          MONGO_DBNAME: db
          MONGO_URL: mongodb://localhost:27017
        run: |
          go get .
          go mod tidy
          go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage report
        working-directory: ${{ matrix.dir }}
        run: |
          go tool cover -func=coverage.out > cover-func.txt
          echo "::group::Coverage (func) — ${{ matrix.dir }}"
          cat cover-func.txt
          echo "::endgroup::"
          {
            echo "### Coverage — \`${{ matrix.dir }}\`"
            echo ""
            echo '```text'
            cat cover-func.txt
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test build
        working-directory: ${{ matrix.dir }}
        run: |
          go build .

  sam-build:
    name: AWS SAM build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: SAM build and validate
        run: |
          make build-all
          sam build
          sam validate
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name tsundoku-api \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --parameter-overrides \
              AuthJwtSecret=${{ secrets.SERVER_AUTH_JWT_SECRET }} \
              MongoUrl=${{ secrets.MONGO_URL }} \
              MongoDbname=${{ secrets.MONGO_DBNAME }} \
              GoogleBooksApiToken=${{ secrets.GOOGLE_BOOKS_API_TOKEN }} \
              IsbnDbApiKey=${{ secrets.ISBNDB_API_KEY }} \
              EnableScheduledIngest=${{ vars.ENABLE_SCHEDULED_INGEST || 'false' }}