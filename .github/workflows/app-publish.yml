name: App Publish

on:
  pull_request:
  push:
    tags:
      - 'app-v*'

jobs:
  publish-android:
    name: Publish to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    strategy:
      matrix:
        flutter-version: ['3.41.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env for build
        run: |
          touch .env
          echo "BIBLIO_API_URL=${{ secrets.BIBLIO_API_URL }}" >> .env
          echo "NEW_RELIC_ANDROID_APP_TOKEN=${{ secrets.APP_ANDROID_NEW_RELIC_TOKEN }}" >> .env
          echo "NEW_RELIC_IOS_APP_TOKEN=${{ secrets.APP_IOS_NEW_RELIC_TOKEN }}" >> .env
      - name: Create key.properties and keystore
        env:
          APP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APP_ANDROID_KEYSTORE_PASSWORD }}
          APP_ANDROID_KEY_PASSWORD: ${{ secrets.APP_ANDROID_KEY_PASSWORD }}
          APP_ANDROID_KEY_ALIAS: ${{ secrets.APP_ANDROID_KEY_ALIAS }}
          APP_ANDROID_KEYSTORE_BASE64: ${{ secrets.APP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "storePassword=$APP_ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$APP_ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$APP_ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties
          echo "$APP_ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.APP_PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.samdouble.biblio
          releaseFile: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  publish-ios:
    name: Publish to App Store (TestFlight)
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    strategy:
      matrix:
        flutter-version: ['3.41.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Import code-signing certificate
        uses: Apple-Actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APP_IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.APP_IOS_CERTIFICATES_P12_PASSWORD }}
          keychain: signing_temp
      - name: Install provisioning profile
        env:
          APP_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APP_IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
      - name: Build IPA
        run: flutter build ipa --release
        env:
          FLUTTER_CODE_SIGNING: true
      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ github.workspace }}/app/build/ios/ipa/Runner.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
