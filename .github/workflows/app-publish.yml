name: App Publish

on:
  pull_request:
  push:
    tags:
      - 'app-v*'

jobs:
  android:
    name: Publish to Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    strategy:
      matrix:
        flutter-version: ['3.41.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env for build
        run: |
          touch .env
          echo "TSUNBOOKU_API_URL=${{ secrets.TSUNBOOKU_API_URL }}" >> .env
          echo "TSUNBOOKU_API_URL=${{ secrets.TSUNBOOKU_API_URL }}" >> .env
          echo "NEW_RELIC_ANDROID_APP_TOKEN=${{ secrets.APP_ANDROID_NEW_RELIC_TOKEN }}" >> .env
          echo "NEW_RELIC_IOS_APP_TOKEN=${{ secrets.APP_IOS_NEW_RELIC_TOKEN }}" >> .env
      - name: Create key.properties and keystore
        env:
          APP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.APP_ANDROID_KEYSTORE_PASSWORD }}
          APP_ANDROID_KEY_PASSWORD: ${{ secrets.APP_ANDROID_KEY_PASSWORD }}
          APP_ANDROID_KEY_ALIAS: ${{ secrets.APP_ANDROID_KEY_ALIAS }}
          APP_ANDROID_KEYSTORE_BASE64: ${{ secrets.APP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "storePassword=$APP_ANDROID_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$APP_ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$APP_ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties
          echo "$APP_ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore.jks
          test -f android/keystore.jks
      - name: Build App Bundle
        run: flutter build appbundle --release
      - name: Verify App Bundle output
        run: |
          ls -lah build/app/outputs/bundle/release
          test -f build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.APP_PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.samdouble.biblio
          releaseFiles: app/build/app/outputs/bundle/release/*.aab
          tracks: internal
          status: draft # completed

  ios:
    name: Publish to App Store
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    strategy:
      matrix:
        flutter-version: ['3.41.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env for build
        run: |
          touch .env
          echo "TSUNBOOKU_API_URL=${{ secrets.TSUNBOOKU_API_URL }}" >> .env
          echo "TSUNBOOKU_API_URL=${{ secrets.TSUNBOOKU_API_URL }}" >> .env
          echo "NEW_RELIC_ANDROID_APP_TOKEN=${{ secrets.APP_ANDROID_NEW_RELIC_TOKEN }}" >> .env
          echo "NEW_RELIC_IOS_APP_TOKEN=${{ secrets.APP_IOS_NEW_RELIC_TOKEN }}" >> .env
      - name: Import code-signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APP_IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.APP_IOS_CERTIFICATES_P12_PASSWORD }}
          keychain: signing_temp
      - name: Install provisioning profile and CI signing overrides
        id: ios_signing
        env:
          APP_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${APP_IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::Secret APP_IOS_PROVISIONING_PROFILE_BASE64 is empty. Add the provisioning profile as base64 (see README)."
            exit 1
          fi
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          TMP_PROFILE="$(mktemp)"
          PLIST_TMP="$(mktemp)"
          echo "$APP_IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$TMP_PROFILE"
          BYTES=$(wc -c < "$TMP_PROFILE" | tr -d ' ')
          if [ "${BYTES:-0}" -eq 0 ]; then
            echo "::error::Decoded provisioning profile is empty. Use base64 of the .mobileprovision file (not the plist alone)."
            exit 1
          fi
          # Write plist to a file — piping empty input into PlistBuddy causes: Cannot parse a NULL or zero-length data
          if ! security cms -D -i "$TMP_PROFILE" -o "$PLIST_TMP" 2>cms.err; then
            echo "::error::security cms -D failed — profile may not be a valid .mobileprovision file."
            cat cms.err || true
            exit 1
          fi
          if [ ! -s "$PLIST_TMP" ]; then
            echo "::error::Decoded CMS plist is empty."
            cat cms.err || true
            exit 1
          fi
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PLIST_TMP" | tr -d '\r\n' | xargs)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PLIST_TMP" | tr -d '\r\n' | xargs)
          rm -f cms.err "$PLIST_TMP"
          cp "$TMP_PROFILE" "$PP_DIR/${UUID}.mobileprovision"
          rm -f "$TMP_PROFILE"
          echo "Installed provisioning profile: UUID=$UUID name=$NAME"
          security find-identity -v -p codesigning || true
          # Strip accidental quote characters from plist Name (avoids Xcode looking for \"samdouble\")
          NAME_CLEAN=$(printf '%s' "$NAME" | tr -d '"' | xargs)
          # Separate xcconfig so Flutter migration does not wipe signing (see CIReleaseSigning.xcconfig).
          # No quotes around the specifier value — xcconfig + Xcode treat embedded \" as part of the name.
          {
            echo '// Generated on CI — manual App Store signing'
            echo 'CODE_SIGN_STYLE = Manual'
            echo 'DEVELOPMENT_TEAM = C4BYX684P3'
            echo 'CODE_SIGN_IDENTITY = Apple Distribution'
            printf 'PROVISIONING_PROFILE_SPECIFIER = %s\n' "$NAME_CLEAN"
            printf 'PROVISIONING_PROFILE = %s\n' "$UUID"
          } > ios/Flutter/CIReleaseSigning.xcconfig
          # Xcode 15.4+ expects app-store-connect; older Xcode uses app-store.
          XCODE_VERSION="$(xcodebuild -version | head -n 1 | awk '{print $2}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          XCODE_MINOR_PATCH="${XCODE_VERSION#*.}"
          XCODE_MINOR="${XCODE_MINOR_PATCH%%.*}"
          if [ "$XCODE_MAJOR" -gt 15 ] || { [ "$XCODE_MAJOR" -eq 15 ] && [ "$XCODE_MINOR" -ge 4 ]; }; then
            EXPORT_METHOD="app-store-connect"
          else
            EXPORT_METHOD="app-store"
          fi
          echo "Using export method: ${EXPORT_METHOD} (Xcode ${XCODE_VERSION})"
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">'
            printf '%s\n' '<dict>'
            printf '%s\n' '  <key>method</key>'
            printf '  <string>%s</string>\n' "$EXPORT_METHOD"
            printf '%s\n' '  <key>teamID</key>'
            printf '%s\n' '  <string>C4BYX684P3</string>'
            printf '%s\n' '  <key>signingStyle</key>'
            printf '%s\n' '  <string>manual</string>'
            printf '%s\n' '  <key>provisioningProfiles</key>'
            printf '%s\n' '  <dict>'
            printf '%s\n' '    <key>com.samdouble.biblio</key>'
            printf '    <string>%s</string>\n' "$UUID"
            printf '%s\n' '  </dict>'
            printf '%s\n' '  <key>uploadBitcode</key>'
            printf '%s\n' '  <false/>'
            printf '%s\n' '  <key>stripSwiftSymbols</key>'
            printf '%s\n' '  <true/>'
            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > ios/ExportOptions.ci.plist
          echo "export_method=${EXPORT_METHOD}" >> "${GITHUB_OUTPUT}"
      - name: Ensure CI signing include (Flutter may rewrite Release.xcconfig during upgrade)
        working-directory: app
        run: |
          set -euo pipefail
          if ! grep -qF 'CIReleaseSigning.xcconfig' ios/Flutter/Release.xcconfig; then
            printf '\n#include? "CIReleaseSigning.xcconfig"\n' >> ios/Flutter/Release.xcconfig
          fi
          test -f ios/Flutter/CIReleaseSigning.xcconfig
      - name: Build and export IPA
        id: ipa
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ipa --release --export-options-plist=ios/ExportOptions.ci.plist
          find_ipa() {
            find build/ios -name '*.ipa' 2>/dev/null | sort | head -n 1
          }
          first="$(find_ipa || true)"
          if [ -z "$first" ]; then
            echo "::warning::flutter build ipa finished without an .ipa (export likely failed); retrying xcodebuild -exportArchive"
            ARCHIVE="$(find build/ios/archive -name '*.xcarchive' | sort | head -n 1)"
            if [ -z "$ARCHIVE" ]; then
              echo "::error::No .xcarchive under build/ios/archive"
              ls -la build/ios || true
              exit 1
            fi
            mkdir -p build/ios/ipa
            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath build/ios/ipa \
              -exportOptionsPlist ios/ExportOptions.ci.plist
            first="$(find_ipa || true)"
          fi
          if [ -z "$first" ]; then
            echo "::error::IPA export failed — archive exists but no .ipa was produced. Check export/signing logs above."
            ls -la build/ios || true
            exit 1
          fi
          IPA_ABS="$(cd "$(dirname "$first")" && pwd)/$(basename "$first")"
          echo "path=${IPA_ABS}" >> "${GITHUB_OUTPUT}"
          echo "Built IPA: ${IPA_ABS}"
        env:
          FLUTTER_CODE_SIGNING: true
      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5.2.1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          backend: appstore-api
          issuer-id: ${{ secrets.APP_IOS_APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_IOS_APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APP_IOS_APPSTORE_PRIVATE_KEY }}
          wait-for-processing: 'false'
