AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tsunbooku API – auth, books, libraries

Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [x86_64]
    Timeout: 5
    MemorySize: 256
    Environment:
      Variables:
        AUTH_JWT_SECRET: !Ref AuthJwtSecret
        GOOGLE_BOOKS_API_TOKEN: !Ref GoogleBooksApiToken
        ISBNDB_API_KEY: !Ref IsbnDbApiKey
        MONGO_DBNAME: !Ref MongoDbname
        MONGO_URL: !Ref MongoUrl

Parameters:
  AuthJwtSecret:
    Type: String
    NoEcho: true
  GoogleBooksApiToken:
    Type: String
    NoEcho: true
  IsbnDbApiKey:
    Type: String
    NoEcho: true
  MongoDbname:
    Type: String
  MongoUrl:
    Type: String
    NoEcho: true
  EnableScheduledIngest:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >-
      When true, EventBridge invokes BooksIngestCatalog every hour.
      Set to false if the deploy IAM user lacks events:* permissions.

Conditions:
  ScheduledIngestEnabled: !Equals [!Ref EnableScheduledIngest, 'true']

Resources:
  TsunbookuHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: Tsunbooku API Gateway

  # --- auth ---
  AuthSendOtp:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/AuthSendOtp
      Handler: bootstrap
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /auth/sendOtp
            Method: POST
      Environment:
        Variables:
          AWS_SES_REGION: us-east-1

  AuthVerifyOtp:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/AuthVerifyOtp
      Handler: bootstrap
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /auth/verifyOtp
            Method: POST

  # --- books ---
  BooksGetBookByIsbn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/BooksGetBookByIsbn
      Handler: bootstrap
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /books/getBookByIsbn
            Method: GET

  BooksGetBooksByAuthor:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/BooksGetBooksByAuthor
      Handler: bootstrap
      Timeout: 60
      MemorySize: 512
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /books/getBooksByAuthor
            Method: POST

  BooksSearchBooks:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/BooksSearchBooks
      Handler: bootstrap
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /books/searchBooks
            Method: POST

  BooksIngestCatalog:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/BooksIngestCatalog
      Handler: bootstrap
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          INGEST_FEED_ENABLED: 'true'
          INGEST_MAX_FEED_PAGES: '3'
          INGEST_FEED_PAGE_SIZE: '100'
          INGEST_MAX_AUTHORS_PER_RUN: '3'
          INGEST_MAX_PAGES_PER_AUTHOR: '2'
          INGEST_AUTHOR_PAGE_SIZE: '100'
          INGEST_AUTHOR_STALE_DAYS: '30'
          INGEST_BULK_ISBN_BATCH_SIZE: '100'

  BooksIngestCatalogHourlyIngestRule:
    Type: AWS::Events::Rule
    Condition: ScheduledIngestEnabled
    Properties:
      Description: Fetch recently updated ISBNs and crawl stale authors from ISBNdb
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt BooksIngestCatalog.Arn
          Id: BooksIngestCatalogHourlyIngestTarget

  BooksIngestCatalogHourlyIngestPermission:
    Type: AWS::Lambda::Permission
    Condition: ScheduledIngestEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BooksIngestCatalog
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BooksIngestCatalogHourlyIngestRule.Arn

  # --- feedback ---
  FeedbackSubmitFeedback:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/FeedbackSubmitFeedback
      Handler: bootstrap
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /feedback/submitFeedback
            Method: POST

  # --- libraries ---
  LibrariesCreateLibrary:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/LibrariesCreateLibrary
      Handler: bootstrap
      Events:
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /libraries
            Method: POST

  LibrariesGetLibraries:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/LibrariesGetLibraries
      Handler: bootstrap
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /libraries
            Method: GET

  LibrariesUpdateLibrary:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/LibrariesUpdateLibrary
      Handler: bootstrap
      Events:
        ApiPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /libraries/{id}
            Method: PATCH

  LibrariesDeleteLibrary:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/LibrariesDeleteLibrary
      Handler: bootstrap
      Events:
        ApiDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /libraries/{id}
            Method: DELETE

  LibrariesGetLibraryBooks:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/LibrariesGetLibraryBooks
      Handler: bootstrap
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /libraries/{id}/books
            Method: GET

  LibrariesSetLibraryBooks:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .build/LibrariesSetLibraryBooks
      Handler: bootstrap
      Events:
        ApiPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref TsunbookuHttpApi
            Path: /libraries/{id}/books
            Method: PUT

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (use this as TSUNBOOKU_API_URL in the app)
    Value: !Sub
      - 'https://${ApiId}.execute-api.${Region}.amazonaws.com'
      - { ApiId: !Ref TsunbookuHttpApi, Region: !Ref AWS::Region }
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'
